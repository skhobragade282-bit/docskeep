<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocsKeep</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --fg: #f2f2f3;
      --muted: #9ca3af;
      --border: #2a2a2e;
      --accent: #5b9dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 420px;
    width: 100%;
    padding: 40px 28px;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p.tag { color: var(--muted); margin: 0 0 28px; }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.linkcard {
    display: block;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  a.linkcard:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>DocsKeep</h1>
    <p class="tag">Keep your documents organized.</p>
    <div class="links">
      <a class="linkcard" href="help.html">Help &amp; How to Use</a>
      <a class="linkcard" href="privacy-policy.html">Privacy Policy</a>
      <a class="linkcard" href="terms-of-use.html">Terms of Use</a>
    </div>
  </div>
</body>
</html>
